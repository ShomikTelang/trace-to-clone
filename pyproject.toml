[project]
name = "traceclone"
version = "0.1.0"
description = "Trace-to-Clone: an experimental, verifiable Kanboard-like application cloning pipeline"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
explore = ["playwright>=1.47,<2"]
llm = ["openai>=1.60"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
all = ["playwright>=1.47,<2", "openai>=1.60", "pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
traceclone = "traceclone.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["traceclone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
